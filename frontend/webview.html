<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the page draw under the notch and home indicator,
      which is also what makes env(safe-area-inset-*) resolve to anything other
      than 0. WebviewShell's safe-area padding is inert without it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Support</title>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <!--
      The player surface's own entry document, served for every /embed/support
      path. Separate from index.html so the shell and home screen can be STATIC
      imports of this entry: that is what lets Vite emit modulepreload links for
      them here, so they download in parallel with the entry bundle instead of
      being discovered only after it executes. It is also what makes the
      console/webview split structural — no agent-console module is reachable
      from this document at all, so Tailwind's preflight cannot cross over.
    -->
    <div id="root">
      <!--
        Painted during HTML parse, before a single byte of JS is requested. React
        replaces it on mount. No path gate is needed any more: this document is
        only ever served for the player surface.
      -->
      <div aria-hidden style="display:flex;flex-direction:column;height:100dvh;width:100%;overflow:hidden;background:#ffffff">
        <div style="height:38%;min-height:11rem;background:linear-gradient(to bottom right,#7c3aed,#5b21b6)"></div>
        <div style="display:flex;flex-direction:column;gap:0.75rem;padding:1.25rem 1rem">
          <div style="height:3.5rem;border-radius:1rem;background:#f5f3fd"></div>
          <div style="height:3.5rem;border-radius:1rem;background:#f5f3fd"></div>
          <div style="height:3.5rem;width:80%;border-radius:1rem;background:#f5f3fd"></div>
        </div>
      </div>
    </div>
    <!--
      Hands off from the SDK's loader as soon as the frame above is on screen.

      The reveal handshake was designed when this document was an empty <div> and
      the first thing worth looking at was React's first paint — so signalling was
      left to WebviewShell, which cannot run until the whole bundle has loaded.
      That made the SDK's ready-signal watchdog (3s, its field default) win every
      time, and the player sat behind a spinner for 3 seconds with a perfectly good
      skeleton already painted underneath it.

      The skeleton above is that "something worth looking at", so this signals
      here instead. WebviewShell still signals on mount; Reveal() is idempotent on
      the SDK side, so the later one is a harmless no-op safety net for the case
      where this script somehow does not run.

      Posted directly, with NO requestAnimationFrame. That is deliberate and it is
      the whole reason this works: the SDK keeps the native view hidden until it
      receives this message, and a hidden webview does not composite, so rAF
      callbacks are throttled or never delivered. Waiting for a frame before
      signalling is waiting for a frame that cannot arrive until the signal is
      sent — a deadlock that resolves only when the SDK's watchdog gives up.
      There is no flash risk to guard against either: the skeleton above is static
      markup already parsed into the DOM by the time this runs, so whatever the
      native view shows on reveal already includes it.
    -->
    <script>
      (function () {
        var send = function () {
          try {
            window.SupportBridge.post({ type: 'surface_ready' })
          } catch (e) {
            /* No bridge: a plain browser. Nothing to reveal, nothing to do. */
          }
        }
        // The SDK injects the bridge on page load, which may land before or after
        // this script — hence both the check and the event. Listened for on window
        // and document because the SDK dispatches on both and neither bubbles.
        if (window.SupportBridge) {
          send()
        } else {
          var once = function () {
            window.removeEventListener('supportbridgeready', once)
            document.removeEventListener('supportbridgeready', once)
            send()
          }
          window.addEventListener('supportbridgeready', once)
          document.addEventListener('supportbridgeready', once)
        }
      })()
    </script>
    <script type="module" src="/src/surfaces/webview/main.tsx"></script>
  </body>
</html>
