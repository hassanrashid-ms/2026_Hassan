<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the page draw under the notch and home indicator,
      which is also what makes env(safe-area-inset-*) resolve to anything other
      than 0. WebviewShell's safe-area padding is inert without it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Support</title>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
